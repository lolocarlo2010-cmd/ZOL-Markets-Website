<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOL Markets — We Turn Followers Into Revenue</title>
<meta name="description" content="ZOL Markets helps creators with 20K–200K followers launch digital products and paid communities. No upfront cost — pure revenue share.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00A651;
    --green-tint:rgba(0,166,81,0.08);
    --ink:#0b0f0e;
    --ink-soft:rgba(11,15,14,0.65);
    --line:rgba(11,15,14,0.10);
    --paper:#ffffff;
    --max:1120px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none; color:inherit;}
  ul{list-style:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}
  section{padding:96px 0;}
  @media (max-width:720px){ section{padding:64px 0;} }

  /* NAV */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    max-width:var(--max); margin:0 auto; padding:18px 24px;
  }
  .logo{font-weight:900; font-size:20px; letter-spacing:0.5px;}
  .logo span{color:var(--green);}
  .nav-links{display:flex; align-items:center; gap:32px;}
  .nav-links a{font-weight:600; font-size:14.5px; color:var(--ink-soft);}
  .nav-links a:hover{color:var(--ink);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:13px 26px; border-radius:100px; font-weight:700; font-size:14.5px;
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-green:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(0,166,81,0.35);}
  .btn-outline{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
  .btn-outline:hover{background:var(--ink); color:#fff;}
  .btn-sm{padding:10px 20px; font-size:13.5px;}
  .menu-toggle{display:none;}
